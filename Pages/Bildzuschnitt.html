<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Crop | Planet</title>
  <link rel="stylesheet" href="https://use.typekit.net/phj5hyp.css?v=2026-05-25">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <link rel="stylesheet" href="../planet.css">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    .crop-page { padding-bottom: var(--space-10); }
    .crop-page .hero { padding-top: var(--space-8); padding-bottom: var(--space-6); }
    .crop-page .hero h1 { font-size: clamp(48px, 7vw, 96px); max-width: 900px; }
    .crop-page .hero h1 em {
      font-style: normal;
      color: var(--planet-primary);
    }
    .crop-page .hero .sub { opacity: 0.65; }

    .crop-main { display: flex; flex-direction: column; gap: var(--space-6); }

    .drop-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      min-height: 280px;
      padding: var(--space-6);
      background: var(--planet-white);
      border: 1.5px dashed var(--planet-tint);
      border-radius: var(--radius-card);
      cursor: pointer;
      transition: border-color var(--motion-fast) var(--ease-out),
                  background var(--motion-fast) var(--ease-out),
                  transform var(--motion-fast) var(--ease-out);
    }
    .drop-zone:hover { border-color: var(--planet-black); background: var(--planet-neutral); }
    .drop-zone.is-dragging {
      border-color: var(--planet-primary);
      background: var(--planet-neutral);
      transform: scale(1.005);
    }
    .drop-zone__icon {
      width: var(--space-8);
      height: var(--space-8);
      border-radius: var(--radius-card);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--planet-neutral);
      color: var(--planet-primary);
      transition: background var(--motion-fast) var(--ease-out), color var(--motion-fast) var(--ease-out);
    }
    .drop-zone.is-dragging .drop-zone__icon {
      background: var(--planet-primary);
      color: var(--planet-white);
    }
    .drop-zone__icon .material-icons-outlined { font-size: var(--icon-lg); }
    .drop-zone h2 { font-size: var(--text-h3); text-align: center; }
    .drop-zone .meta { text-align: center; }

    .crop-panel {
      border: 1px solid var(--planet-tint);
      border-radius: var(--radius-card);
      padding: var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }
    .crop-panel__head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-2);
      flex-wrap: wrap;
    }
    .crop-panel__head h3 { font-size: var(--text-h4); }

    .file-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: var(--space-1);
      max-height: 128px;
      overflow-y: auto;
    }
    .file-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-1);
      padding: var(--space-1) var(--space-2);
      background: var(--planet-neutral);
      border-radius: var(--radius-pill);
      font-size: var(--text-meta);
      min-width: 0;
    }
    .file-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-chip button {
      flex: none;
      width: 24px;
      height: 24px;
      border: 0;
      border-radius: var(--radius-circle);
      background: transparent;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      color: var(--planet-black);
      opacity: 0.35;
      transition: opacity var(--motion-instant) var(--ease-out);
    }
    .file-chip button:hover { opacity: 1; }

    .name-field {
      background: var(--planet-neutral);
      border-radius: var(--radius-card);
      padding: var(--space-3);
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }
    .name-field .input-label { margin-bottom: 0; }

    .format-field {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .format-options {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
    }
    .format-option {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      padding: var(--space-1) var(--space-2);
      background: var(--planet-neutral);
      border-radius: var(--radius-pill);
      border: 1.5px solid transparent;
      cursor: pointer;
      font-family: var(--planet-font);
      font-weight: var(--weight-display);
      font-size: var(--text-meta);
      transition: border-color var(--motion-instant) var(--ease-out),
                  background var(--motion-instant) var(--ease-out);
      user-select: none;
    }
    .format-option:has(input:checked) {
      border-color: var(--planet-primary);
      background: var(--planet-white);
    }
    .format-option input {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--planet-primary);
      cursor: pointer;
    }

    .circle-editor {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      padding: var(--space-3);
      background: var(--planet-neutral);
      border-radius: var(--radius-card);
    }
    .circle-editor__head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-2);
      flex-wrap: wrap;
    }
    .circle-editor__head h3 { font-size: var(--text-h4); }
    .circle-editor .meta { opacity: 0.65; }
    .circle-editor .format-option { background: var(--planet-white); }
    .circle-files {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-1);
    }
    .circle-file {
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      border: 1.5px solid transparent;
      background: var(--planet-white);
      color: var(--planet-black);
      border-radius: var(--radius-pill);
      padding: var(--space-1) var(--space-2);
      font-family: var(--planet-font);
      font-weight: var(--weight-display);
      font-size: var(--text-meta);
      cursor: pointer;
    }
    .circle-file.is-active { border-color: var(--planet-primary); }
    .circle-stage-wrap { display: flex; justify-content: center; }
    .circle-stage {
      position: relative;
      width: min(360px, 100%);
      aspect-ratio: 1;
      border-radius: 50%;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      border: 1px solid var(--planet-tint);
      background: var(--planet-white);
    }
    .circle-stage.is-dragging { cursor: grabbing; }
    .circle-stage img {
      position: absolute;
      max-width: none;
      user-select: none;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    .circle-scale {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: var(--space-2);
    }
    .circle-scale input[type="range"] {
      width: 100%;
      margin: 0;
      accent-color: var(--planet-primary);
    }
    .circle-stage-block {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    .btn--block { width: 100%; }

    .results-head { text-align: center; padding-top: var(--space-4); scroll-margin-top: var(--space-4); }
    .results-head h2 { font-size: clamp(40px, 5vw, 64px); }
    .results-head p { opacity: 0.65; margin-top: var(--space-1); }

    .result-card {
      border: 1px solid var(--planet-tint);
      border-radius: var(--radius-card);
      padding: var(--space-5);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }
    .result-card__head {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
    }
    .result-num {
      flex: none;
      width: var(--space-5);
      height: var(--space-5);
      border-radius: var(--radius-card);
      background: var(--planet-black);
      color: var(--planet-white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: var(--weight-display);
      font-size: var(--text-meta);
    }
    .result-card__head h4 {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .crop-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-4);
    }
    .crop-item { display: flex; flex-direction: column; gap: var(--space-2); align-items: stretch; }
    .crop-frame {
      background: var(--planet-neutral);
      border-radius: var(--radius-card);
      overflow: hidden;
      border: 1px solid var(--planet-tint);
      width: 100%;
      aspect-ratio: var(--crop-ratio);
    }
    .crop-frame--9x16 {
      width: auto;
      max-width: 100%;
      height: min(65vh, 520px);
      aspect-ratio: 9 / 16;
      margin-inline: auto;
    }
    .crop-frame--circle {
      background-color: var(--planet-white);
      background-image:
        linear-gradient(45deg, var(--planet-neutral) 25%, transparent 25%),
        linear-gradient(-45deg, var(--planet-neutral) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--planet-neutral) 75%),
        linear-gradient(-45deg, transparent 75%, var(--planet-neutral) 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    }
    .crop-frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .crop-item__foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-1);
    }
    .crop-item__foot .status-badge { background: var(--planet-neutral); color: var(--planet-black); }

    .zip-action {
      display: flex;
      justify-content: center;
      padding: var(--space-4) 0 var(--space-6);
    }
    .zip-action .btn { font-size: var(--text-body); padding: 0 var(--space-5); height: calc(var(--height-button) + var(--space-1)); }

    .crop-footer {
      text-align: center;
      padding: var(--space-4) 0;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 900px) {
      .crop-grid { grid-template-columns: 1fr; }
      .crop-frame { max-height: 360px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const FORMATS = ['9x16', '4x5', '1x1', '1x1kreis'];

    const FORMAT_CONFIG = {
      '9x16': { ratio: 9 / 16, label: '9:16' },
      '4x5': { ratio: 4 / 5, label: '4:5' },
      '1x1': { ratio: 1 / 1, label: '1:1' },
      '1x1kreis': { ratio: 1 / 1, label: '1:1 Kreis', circle: true },
    };

    const CIRCLE_EXPORTS = [
      { size: 600, label: '600 px · E-Mail-Portrait' },
      { size: 1080, label: '1080 × 1080 px' },
    ];

    const defaultFormats = () => Object.fromEntries(FORMATS.map((f) => [f, true]));
    const defaultCircleFrame = () => ({ scale: 1, offsetX: 0, offsetY: 0 });
    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

    const clampCircleFrame = (frame, nw, nh) => {
      const scale = clamp(frame.scale, 1, 4);
      const cover = Math.max(1 / nw, 1 / nh);
      const maxX = Math.max(0, (nw * cover * scale - 1) / 2);
      const maxY = Math.max(0, (nh * cover * scale - 1) / 2);
      return {
        scale,
        offsetX: clamp(frame.offsetX, -maxX, maxX),
        offsetY: clamp(frame.offsetY, -maxY, maxY),
      };
    };

    const circleImageLayout = (nw, nh, frame, size) => {
      const safe = clampCircleFrame(frame, nw, nh);
      const cover = Math.max(size / nw, size / nh);
      const width = nw * cover * safe.scale;
      const height = nh * cover * safe.scale;
      return {
        width,
        height,
        x: (size - width) / 2 + safe.offsetX * size,
        y: (size - height) / 2 + safe.offsetY * size,
      };
    };

    const renderCirclePng = (image, frame, exportSize) => {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = exportSize;
      canvas.height = exportSize;
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      const layout = circleImageLayout(image.naturalWidth, image.naturalHeight, frame, exportSize);
      ctx.drawImage(image, layout.x, layout.y, layout.width, layout.height);
      ctx.globalCompositeOperation = 'destination-in';
      ctx.beginPath();
      ctx.arc(exportSize / 2, exportSize / 2, exportSize / 2, 0, Math.PI * 2);
      ctx.fill();
      return canvas.toDataURL('image/png');
    };

    const CircleStage = ({ url, frame, onChange }) => {
      const stageRef = useRef(null);
      const frameRef = useRef(frame);
      const onChangeRef = useRef(onChange);
      const naturalRef = useRef(null);
      const dragRef = useRef(null);
      const [loaded, setLoaded] = useState(null);
      const [view, setView] = useState(0);
      const [dragging, setDragging] = useState(false);
      const natural = loaded && loaded.url === url ? loaded : null;

      frameRef.current = frame;
      onChangeRef.current = onChange;
      naturalRef.current = natural;

      useEffect(() => {
        const el = stageRef.current;
        if (!el) return undefined;
        const measure = () => setView(el.clientWidth);
        measure();
        const observer = new ResizeObserver(measure);
        observer.observe(el);
        return () => observer.disconnect();
      }, []);

      useEffect(() => {
        const el = stageRef.current;
        if (!el) return undefined;
        const onWheel = (event) => {
          const size = naturalRef.current;
          if (!size) return;
          event.preventDefault();
          const current = frameRef.current;
          const scale = current.scale * Math.exp(-event.deltaY * 0.0012);
          onChangeRef.current(clampCircleFrame({ ...current, scale }, size.w, size.h));
        };
        el.addEventListener('wheel', onWheel, { passive: false });
        return () => el.removeEventListener('wheel', onWheel);
      }, []);

      const apply = (next) => {
        const size = naturalRef.current;
        if (!size) return;
        onChangeRef.current(clampCircleFrame(next, size.w, size.h));
      };

      const endDrag = (event) => {
        dragRef.current = null;
        setDragging(false);
        if (event?.currentTarget?.hasPointerCapture?.(event.pointerId)) {
          event.currentTarget.releasePointerCapture(event.pointerId);
        }
      };

      const layout = natural && view
        ? circleImageLayout(natural.w, natural.h, frame, view)
        : null;

      return (
        <div className="circle-stage-block">
          <div className="circle-stage-wrap">
            <div
              ref={stageRef}
              className={`circle-stage${dragging ? ' is-dragging' : ''}`}
              role="application"
              aria-label="Bildausschnitt verschieben"
              onPointerDown={(event) => {
                dragRef.current = {
                  x: event.clientX,
                  y: event.clientY,
                  offsetX: frame.offsetX,
                  offsetY: frame.offsetY,
                };
                setDragging(true);
                try { event.currentTarget.setPointerCapture(event.pointerId); } catch (err) { /* pointer already released */ }
              }}
              onPointerMove={(event) => {
                const drag = dragRef.current;
                if (!drag || !naturalRef.current) return;
                const width = stageRef.current?.clientWidth || 1;
                apply({
                  scale: frameRef.current.scale,
                  offsetX: drag.offsetX + (event.clientX - drag.x) / width,
                  offsetY: drag.offsetY + (event.clientY - drag.y) / width,
                });
              }}
              onPointerUp={endDrag}
              onPointerCancel={endDrag}
            >
              <img
                src={url}
                alt=""
                draggable={false}
                onLoad={(event) => {
                  setLoaded({
                    url,
                    w: event.currentTarget.naturalWidth,
                    h: event.currentTarget.naturalHeight,
                  });
                }}
                style={layout ? {
                  width: `${layout.width}px`,
                  height: `${layout.height}px`,
                  left: `${layout.x}px`,
                  top: `${layout.y}px`,
                } : { visibility: 'hidden' }}
              />
            </div>
          </div>
          <p className="meta">Ziehen zum Verschieben. Regler oder Mausrad zum Skalieren.</p>
          <div className="circle-scale">
            <label className="input-label" htmlFor="circle-scale">Skalierung</label>
            <input
              id="circle-scale"
              type="range"
              min="1"
              max="4"
              step="0.01"
              value={frame.scale}
              aria-label="Skalierung"
              aria-valuetext={`${Math.round(frame.scale * 100)} Prozent`}
              onChange={(event) => apply({ ...frame, scale: Number(event.target.value) })}
            />
            <span className="meta">{Math.round(frame.scale * 100)}%</span>
          </div>
        </div>
      );
    };

    const App = () => {
      const [selectedFiles, setSelectedFiles] = useState([]);
      const [croppedImages, setCroppedImages] = useState([]);
      const [isLoading, setIsLoading] = useState(false);
      const [isDragging, setIsDragging] = useState(false);
      const [customBaseName, setCustomBaseName] = useState('');
      const [selectedFormats, setSelectedFormats] = useState(defaultFormats);
      const [circleFrames, setCircleFrames] = useState([]);
      const [circleEditIndex, setCircleEditIndex] = useState(0);
      const [circleExportSize, setCircleExportSize] = useState(600);
      const [previewUrls, setPreviewUrls] = useState([]);
      const fileInputRef = useRef(null);
      const resultsRef = useRef(null);

      const activeFormats = FORMATS.filter((f) => selectedFormats[f]);
      const circleEditAt = Math.min(circleEditIndex, Math.max(0, selectedFiles.length - 1));
      const activeCircleFrame = circleFrames[circleEditAt] || defaultCircleFrame();

      useEffect(() => {
        if (croppedImages.length > 0 && resultsRef.current) {
          resultsRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }, [croppedImages]);

      useEffect(() => {
        const urls = selectedFiles.map((file) => URL.createObjectURL(file));
        setPreviewUrls(urls);
        return () => urls.forEach((url) => URL.revokeObjectURL(url));
      }, [selectedFiles]);

      const getFormattedFileName = (base, format, circleSize) => (
        format === '1x1kreis' && circleSize
          ? `${base}_${format}_${circleSize}.png`
          : `${base}_${format}.png`
      );

      const addFiles = (files) => {
        const validFiles = Array.from(files).filter(
          (file) => file.type === 'image/jpeg' || file.type === 'image/png'
        );
        if (!validFiles.length) return;
        setSelectedFiles((prev) => [...prev, ...validFiles]);
        setCircleFrames((prev) => [...prev, ...validFiles.map(() => defaultCircleFrame())]);
      };

      const handleDragOver = (e) => {
        e.preventDefault();
        setIsDragging(true);
      };

      const handleDragLeave = (e) => {
        e.preventDefault();
        setIsDragging(false);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        if (e.dataTransfer.files?.length) addFiles(e.dataTransfer.files);
      };

      const processInitialWidth = (image, maxWidth) => {
        return new Promise((resolve) => {
          const originalWidth = image.naturalWidth;
          const originalHeight = image.naturalHeight;
          if (originalWidth <= maxWidth) return resolve(image);

          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = maxWidth;
          canvas.height = originalHeight;
          const startX = (originalWidth - maxWidth) / 2;
          ctx.drawImage(image, startX, 0, maxWidth, originalHeight, 0, 0, maxWidth, originalHeight);

          const processedImg = new Image();
          processedImg.onload = () => resolve(processedImg);
          processedImg.src = canvas.toDataURL('image/png');
        });
      };

      const cropImage = (image, targetAspectRatio) => {
        return new Promise((resolve) => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const currentWidth = image.naturalWidth;
          const currentHeight = image.naturalHeight;

          let cropWidth = currentWidth;
          let cropHeight = currentWidth / targetAspectRatio;
          let startX = 0;
          let startY = 0;

          if (cropHeight > currentHeight) {
            cropHeight = currentHeight;
            cropWidth = currentHeight * targetAspectRatio;
            startX = (currentWidth - cropWidth) / 2;
          } else {
            startY = (currentHeight - cropHeight) / 2;
          }

          canvas.width = cropWidth;
          canvas.height = cropHeight;
          ctx.drawImage(image, startX, startY, cropWidth, cropHeight, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/png'));
        });
      };

      const removeFile = (index) => {
        setSelectedFiles((prev) => prev.filter((_, idx) => idx !== index));
        setCircleFrames((prev) => prev.filter((_, idx) => idx !== index));
        setCircleEditIndex((current) => (index < current ? current - 1 : current));
      };

      const updateCircleFrame = (index, frame) => {
        setCircleFrames((prev) => prev.map((item, idx) => (idx === index ? frame : item)));
      };

      const toggleFormat = (fmt) => {
        setSelectedFormats((prev) => {
          const active = FORMATS.filter((f) => prev[f]);
          if (prev[fmt] && active.length <= 1) return prev;
          return { ...prev, [fmt]: !prev[fmt] };
        });
      };

      const processImages = async () => {
        const formatsToProcess = FORMATS.filter((f) => selectedFormats[f]);
        if (!formatsToProcess.length) return;

        setIsLoading(true);
        setCroppedImages([]);
        const processed = [];

        for (let i = 0; i < selectedFiles.length; i++) {
          const file = selectedFiles[i];
          let imageUrl = null;

          let baseNameForThisFile = '';
          if (customBaseName.trim() !== '') {
            baseNameForThisFile = selectedFiles.length > 1
              ? `${customBaseName.trim()}_${i + 1}`
              : customBaseName.trim();
          } else {
            baseNameForThisFile = file.name.replace(/\.[^.]+$/, '');
          }

          try {
            imageUrl = URL.createObjectURL(file);
            const img = new Image();
            await new Promise((res, rej) => {
              img.onload = res;
              img.onerror = rej;
              img.src = imageUrl;
            });

            const initialProcessedImg = await processInitialWidth(img, 1080);
            const crops = {};

            for (const fmt of formatsToProcess) {
              crops[fmt] = FORMAT_CONFIG[fmt].circle
                ? renderCirclePng(img, circleFrames[i] || defaultCircleFrame(), circleExportSize)
                : await cropImage(initialProcessedImg, FORMAT_CONFIG[fmt].ratio);
            }

            processed.push({
              targetBaseName: baseNameForThisFile,
              formats: formatsToProcess,
              crops,
              circleSize: formatsToProcess.some((fmt) => FORMAT_CONFIG[fmt].circle) ? circleExportSize : null,
            });
          } catch (e) {
            console.error(e);
          } finally {
            if (imageUrl) URL.revokeObjectURL(imageUrl);
          }
        }

        setCroppedImages(processed);
        setIsLoading(false);
      };

      const downloadImage = (dataUrl, fileName) => {
        const link = document.createElement('a');
        link.href = dataUrl;
        link.download = fileName;
        link.click();
      };

      const downloadAllImages = async () => {
        const zip = new window.JSZip();
        croppedImages.forEach((item) => {
          item.formats.forEach((fmt) => {
            const dataUrl = item.crops[fmt];
            if (dataUrl) {
              zip.file(getFormattedFileName(item.targetBaseName, fmt, item.circleSize), dataUrl.split(',')[1], { base64: true });
            }
          });
        });
        const content = await zip.generateAsync({ type: 'blob' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = `${customBaseName.trim() || 'social_crops'}.zip`;
        link.click();
      };

      return (
        <div className="crop-page">
          <section className="hero">
            <div className="container flow">
              <h1>Image <em>Crop</em></h1>
              <p className="sub">Verlustfreier Zuschnitt mit individueller Benennung — 9:16, 4:5, 1:1 und 1:1 Kreis für Social Media.</p>
            </div>
          </section>

          <main className="container crop-main">
            <div
              className={`drop-zone${isDragging ? ' is-dragging' : ''}`}
              onDragOver={handleDragOver}
              onDragLeave={handleDragLeave}
              onDrop={handleDrop}
              onClick={() => fileInputRef.current?.click()}
              role="button"
              tabIndex={0}
              onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') fileInputRef.current?.click(); }}
            >
              <input
                type="file"
                multiple
                accept="image/jpeg,image/png"
                onChange={(e) => { addFiles(e.target.files); e.target.value = ''; }}
                className="visually-hidden"
                ref={fileInputRef}
              />
              <div className="drop-zone__icon">
                <span className="material-icons-outlined">upload_file</span>
              </div>
              <h2>{isDragging ? 'Bilder jetzt loslassen' : 'Bilder hierher ziehen'}</h2>
            </div>

            {selectedFiles.length > 0 && (
              <section className="crop-panel">
                <div className="crop-panel__head">
                  <h3>{selectedFiles.length} {selectedFiles.length === 1 ? 'Bild' : 'Bilder'} ausgewählt</h3>
                  <button type="button" className="btn btn--ghost" onClick={() => { setSelectedFiles([]); setCircleFrames([]); setCircleEditIndex(0); }}>
                    Liste leeren
                  </button>
                </div>

                <div className="file-list">
                  {selectedFiles.map((f, i) => (
                    <div key={`${f.name}-${i}`} className="file-chip">
                      <span>{f.name}</span>
                      <button
                        type="button"
                        aria-label={`${f.name} entfernen`}
                        onClick={(e) => { e.stopPropagation(); removeFile(i); }}
                      >×</button>
                    </div>
                  ))}
                </div>

                <div className="format-field">
                  <span className="input-label">Formate</span>
                  <div className="format-options">
                    {FORMATS.map((fmt) => (
                      <label key={fmt} className="format-option">
                        <input
                          type="checkbox"
                          checked={selectedFormats[fmt]}
                          onChange={() => toggleFormat(fmt)}
                        />
                        {FORMAT_CONFIG[fmt].label}
                      </label>
                    ))}
                  </div>
                </div>

                {selectedFormats['1x1kreis'] && previewUrls[circleEditAt] && (
                  <div className="circle-editor">
                    <div className="circle-editor__head">
                      <h3>Kreis zuschneiden</h3>
                      <button
                        type="button"
                        className="btn btn--ghost"
                        onClick={() => updateCircleFrame(circleEditAt, defaultCircleFrame())}
                      >
                        Zurücksetzen
                      </button>
                    </div>
                    {selectedFiles.length > 1 && (
                      <div className="circle-files">
                        {selectedFiles.map((file, index) => (
                          <button
                            key={`${file.name}-${index}`}
                            type="button"
                            className={`circle-file${index === circleEditAt ? ' is-active' : ''}`}
                            onClick={() => setCircleEditIndex(index)}
                          >
                            {file.name}
                          </button>
                        ))}
                      </div>
                    )}
                    <CircleStage
                      url={previewUrls[circleEditAt]}
                      frame={activeCircleFrame}
                      onChange={(frame) => updateCircleFrame(circleEditAt, frame)}
                    />
                    <div className="format-field">
                      <span className="input-label">Exportgröße</span>
                      <div className="format-options" role="radiogroup" aria-label="Exportgröße">
                        {CIRCLE_EXPORTS.map((option) => (
                          <label key={option.size} className="format-option">
                            <input
                              type="radio"
                              name="circle-export"
                              checked={circleExportSize === option.size}
                              onChange={() => setCircleExportSize(option.size)}
                            />
                            {option.label}
                          </label>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                <div className="name-field">
                  <label className="input-label" htmlFor="base-name">Basis-Dateiname (optional)</label>
                  <input
                    id="base-name"
                    className="input"
                    type="text"
                    value={customBaseName}
                    onChange={(e) => setCustomBaseName(e.target.value)}
                    placeholder="YYYY_MM_DD_Brand_Produkt_Bezeichnung"
                  />
                </div>

                <button
                  type="button"
                  className="btn btn--block"
                  onClick={processImages}
                  disabled={isLoading || activeFormats.length === 0}
                >
                  {isLoading ? 'Verarbeitung läuft…' : 'Jetzt verlustfrei zuschneiden'}
                </button>
              </section>
            )}

            {croppedImages.length > 0 && (
              <section className="flow">
                <div className="results-head" ref={resultsRef}>
                  <h2>Deine Ergebnisse</h2>
                  <p>Alle Dateien werden als PNG gespeichert.</p>
                </div>

                {croppedImages.map((item, idx) => (
                  <article key={item.targetBaseName} className="result-card">
                    <div className="result-card__head">
                      <span className="result-num">{idx + 1}</span>
                      <h4>{item.targetBaseName}.png</h4>
                    </div>

                    <div
                      className="crop-grid"
                      style={{ gridTemplateColumns: `repeat(${item.formats.length}, 1fr)` }}
                    >
                      {item.formats.map((fmt) => (
                        <div key={fmt} className="crop-item">
                          <div
                            className={`crop-frame crop-frame--${fmt}${FORMAT_CONFIG[fmt].circle ? ' crop-frame--circle' : ''}`}
                            style={{ '--crop-ratio': FORMAT_CONFIG[fmt].ratio }}
                          >
                            <img src={item.crops[fmt]} alt={`${item.targetBaseName} ${fmt}`} />
                          </div>
                          <div className="crop-item__foot">
                            <span className="status-badge">
                              {FORMAT_CONFIG[fmt].circle && item.circleSize
                                ? `${FORMAT_CONFIG[fmt].label} · ${item.circleSize === 600 ? '600 px' : '1080 × 1080'}`
                                : FORMAT_CONFIG[fmt].label}
                            </span>
                            <button
                              type="button"
                              className="btn btn--secondary"
                              onClick={() => downloadImage(item.crops[fmt], getFormattedFileName(item.targetBaseName, fmt, item.circleSize))}
                            >
                              Download
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </article>
                ))}

                <div className="zip-action">
                  <button type="button" className="btn btn--highlight" onClick={downloadAllImages}>
                    Alle Bilder als ZIP herunterladen
                    <span className="material-icons-outlined">download</span>
                  </button>
                </div>
              </section>
            )}
          </main>

          <footer className="crop-footer">
            <div className="container">
              <span className="meta">Dateinamen enden auf _9x16, _4x5, _1x1 oder _1x1kreis_600 / _1x1kreis_1080. Der Kreis ist ein PNG mit transparenten Ecken.</span>
            </div>
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
